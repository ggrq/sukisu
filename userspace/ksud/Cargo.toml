[package]
name = "ksud"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
const_format = "0.2"
log.workspace = true
env_logger = { version = "0.11", default-features = false }
rust-embed = { version = "8", features = [
    "debug-embed",
    "compression", # must clean build after updating binaries
] }
which = "8"
sha1 = "0.11"
base16ct = { version = "0.2", features = ["alloc"] }
sha256 = "1"
tempfile = "3"
chrono = "0.4"
regex-lite = "0.1"
memmap2 = "0.9"
android-bootimg = { git = "https://github.com/5ec1cff/android_bootimg", rev = "153423f6310fd4ae187e32da48e97b9fc613b783" }
wait-timeout = "0.2.1"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1", features = [
    "all-apis",
] }
android-properties = { version = "0.2", features = ["bionic-deprecated"] }
android_logger = { version = "0.15", default-features = false }
zip = { version = "8",  features = [
    "deflate",
    "deflate64",
    "time",
    "lzma",
    "xz",
], default-features = false }
zip-extensions = { version = "0.14", features = [
    "deflate",
    "lzma",
    "xz",
], default-features = false }
# 原 git 依赖 Kernel-SU/java-properties 已转私有，改用 crates.io 公开版
java-properties = { version = "2.0", default-features = false }
serde_json = "1"
encoding_rs = "0.8"
humansize = "2"
libc = "0.2"
extattr = "1"
jwalk = "0.8"
is_executable = "1"
nom = "8"
derive-new = "0.7"
getopts = "0.2"
ksuinit = { path = "../ksuinit" }
# 原 git 依赖 Kernel-SU/adb_client 已转私有，改用公开镜像 MySU-org/adb_client（保留原始 API：tcp::ADBTcpDevice + shell_command）
adb_client = { git = "https://github.com/MySU-org/adb_client", rev = "d97a966435bebaa55017834869dec08150826aa7" }
# 原 git 依赖 Kernel-SU/ksu_props 已转私有，改用公开 fork MySU-org/ksu_props（HEAD 即所需 rev）
prop-rs-android = { git = "https://github.com/MySU-org/ksu_props", rev = "6f5723105d8d4cacad31d83d343defbf032c7b33" }
serde = { version = "1.0", features = ["derive"] }
notify = "6.1"

[target.'cfg(all(target_os = "android", target_arch = "aarch64"))'.dependencies]
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }

[build-dependencies]
bindgen = "0.72"
